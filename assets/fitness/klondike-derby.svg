<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="klondike-derby-title klondike-derby-desc" data-motion-state="final"><title id="klondike-derby-title">Klondike Derby winter course</title><desc id="klondike-derby-desc">A sled route passes a fence, field, snowman, return marker, and air-rifle target.</desc><style>.bg{fill:#071525}.grid{fill:none;stroke:#244968;stroke-width:1;opacity:.42}.ice{fill:none;stroke:#dcecf5;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}.ice-fill{fill:#dcecf5}.depth{fill:none;stroke:#6b91aa;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.shadow{fill:#02070d;opacity:.55}.gold{fill:none;stroke:#e6bb50;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.motion-layer{pointer-events:none}.gold-trace{stroke-dasharray:1100;stroke-dashoffset:0}.ambient-glow{fill:none;stroke:#e6bb50;stroke-width:2;opacity:.28}svg:target .gold-trace{animation:trace 1.7s ease-out both}svg:target .ambient-glow{animation:glow 1.7s ease-out both}@keyframes trace{from{stroke-dashoffset:1100}to{stroke-dashoffset:0}}@keyframes glow{from{opacity:0}to{opacity:.28}}@media(prefers-reduced-motion: reduce){svg:target .gold-trace,svg:target .ambient-glow{animation:none}}</style><rect class="bg" width="720" height="420"/><path class="grid" d="M0 70H720M0 140H720M0 210H720M0 280H720M0 350H720M90 0V420M180 0V420M270 0V420M360 0V420M450 0V420M540 0V420M630 0V420"/><path class="depth" d="M25 338Q150 300 246 321T425 286T690 305"/><g id="sled"><path class="ice" d="M48 290h112l-12 34H65zM55 326q10 22 36 12h65q19 0 27-19M68 288v-30h72v30"/><path class="gold" d="M55 334h115"/></g><path id="pull-rope" class="gold" d="M160 292Q193 256 230 244"/><g id="sled-puller" class="ice"><circle class="ice-fill" stroke="none" cx="250" cy="201" r="13"/><path d="M244 216l-9 46m4-27l-33 14m29 13l-34 35m34-35l33 38"/></g><g id="fence-obstacle" class="ice"><path d="M305 210v108m70-121v107M292 233l96-14m-96 45l96-13"/></g><path id="field-path" class="gold" stroke-dasharray="8 10" d="M385 289q40-35 76-20"/><g id="snowman"><circle class="ice-fill" cx="490" cy="283" r="36"/><circle class="ice-fill" cx="490" cy="231" r="27"/><circle class="ice-fill" cx="490" cy="191" r="18"/><circle fill="#071525" cx="484" cy="187" r="2.5"/><circle fill="#071525" cx="497" cy="187" r="2.5"/><path class="gold" d="M490 192l12 4m-35 31l-32-20m78 20l29-20M472 168h38m-32-8h25"/></g><path id="return-marker" class="gold" d="M535 315q37 21 69-2l-12-4m12 4l-7 11"/><g id="air-rifle" transform="translate(552 210)"><path fill="#dcecf5" d="M0 33l24-20h28l13 12-20 15H20L8 52H0z"/><path class="ice" d="M47 20h33l0 8h-35m35-4h58m-14-8v16M37 39q3 16 15 16h9q8-1 7-11"/><circle class="gold" fill="none" cx="57" cy="40" r="7"/></g><g id="target"><path class="ice" d="M694 163v145m-22 0h44"/><circle fill="#dcecf5" cx="694" cy="151" r="24"/><circle fill="#071525" cx="694" cy="151" r="15"/><circle fill="#e6bb50" cx="694" cy="151" r="6"/></g><path class="gold" d="M630 230l54-64"/><g class="motion-layer"><rect class="ambient-glow" x="13" y="13" width="694" height="394" rx="18"/><path class="gold gold-trace" d="M35 386H685"/></g></svg>