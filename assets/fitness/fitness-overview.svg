<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="fitness-overview-title fitness-overview-desc" data-motion-state="final">
<title id="fitness-overview-title">Fitness competitions overview</title><desc id="fitness-overview-desc">Three illuminated pathways connect running, strength, and winter challenge stations.</desc>
<style>:root{--navy:#071525;--blue:#244968;--gold:#e6bb50;--ice:#dcecf5}.bg{fill:var(--navy)}.grid{stroke:var(--blue);stroke-width:1;opacity:.55}.motion-layer{fill:none;stroke:var(--ice);stroke-width:8;stroke-linecap:round;stroke-linejoin:round}.route{stroke:var(--gold);stroke-width:5;stroke-dasharray:900;stroke-dashoffset:900}svg:target .route{animation:draw 1.7s ease-out forwards}svg:target .delay{animation-delay:.25s}@keyframes draw{to{stroke-dashoffset:0}}@media(prefers-reduced-motion: reduce){svg:target .route{animation:none;stroke-dashoffset:0}}</style>
<rect class="bg" width="720" height="420"/><g class="grid"><path d="M0 70H720M0 140H720M0 210H720M0 280H720M0 350H720M90 0V420M180 0V420M270 0V420M360 0V420M450 0V420M540 0V420M630 0V420"/></g><g class="motion-layer"><path class="route" d="M70 305 C180 150 280 340 390 190 S570 120 660 245"/><circle cx="115" cy="255" r="32"/><path d="M95 255h40M115 235v40"/><circle cx="360" cy="220" r="32"/><path d="M340 220h40M360 200v40"/><circle cx="610" cy="205" r="32"/><path d="M590 205h40M610 185v40"/></g></svg>