<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="fitness-overview-title fitness-overview-desc" data-motion-state="final"><title id="fitness-overview-title">Fitness competition track</title><desc id="fitness-overview-desc">Anonymous runners move through distinct stride phases on a curved multi-lane track.</desc><style>.bg{fill:#071525}.grid{fill:none;stroke:#244968;stroke-width:1;opacity:.42}.ice{fill:none;stroke:#dcecf5;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}.ice-fill{fill:#dcecf5}.depth{fill:none;stroke:#6b91aa;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.shadow{fill:#02070d;opacity:.55}.gold{fill:none;stroke:#e6bb50;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.motion-layer{pointer-events:none}.gold-trace{stroke-dasharray:1100;stroke-dashoffset:0}.ambient-glow{fill:none;stroke:#e6bb50;stroke-width:2;opacity:.28}svg:target .gold-trace{animation:trace 1.7s ease-out both}svg:target .ambient-glow{animation:glow 1.7s ease-out both}@keyframes trace{from{stroke-dashoffset:1100}to{stroke-dashoffset:0}}@keyframes glow{from{opacity:0}to{opacity:.28}}@media(prefers-reduced-motion: reduce){svg:target .gold-trace,svg:target .ambient-glow{animation:none}}</style><rect class="bg" width="720" height="420"/><path class="grid" d="M0 70H720M0 140H720M0 210H720M0 280H720M0 350H720M90 0V420M180 0V420M270 0V420M360 0V420M450 0V420M540 0V420M630 0V420"/><g id="track"><path class="depth" stroke-width="38" d="M55 334C160 118 540 85 675 248C700 280 678 326 625 347C480 401 180 393 55 334Z"/><path class="gold" d="M72 328C175 145 527 111 652 252C672 276 650 302 608 320C470 369 209 368 72 328Z"/><g id="track-lanes" class="depth"><path d="M104 322C205 172 510 139 625 256C640 271 622 286 590 299C460 340 241 343 104 322Z"/><path d="M142 315C240 198 488 169 595 258C603 267 588 276 565 284C449 314 277 320 142 315Z"/></g></g><path class="shadow" d="M182 328h115l-20 12h-112zm184-75h112l-18 11H350zm122-113h100l-17 10h-98z"/><g id="runner-1" class="ice"><circle class="ice-fill" stroke="none" cx="225" cy="230" r="15"/><path d="M222 249l18 52m-8-32l-39 11m42-19l33-28m-28 68l-38 30m38-30l46 21"/></g><g id="runner-2" class="ice"><circle class="ice-fill" stroke="none" cx="410" cy="167" r="14"/><path d="M408 185l-9 48m5-27l-34-23m31 21l40 12m-42 17l-34 26m34-26l40 20"/></g><g id="runner-3" class="ice"><circle class="ice-fill" stroke="none" cx="535" cy="105" r="12"/><path d="M532 121l17 39m-10-24l-26 12m30-10l25-22m-19 44l-23 22m23-22l31 11"/></g><g id="finish-progress" class="gold"><path d="M598 179v110m35-123v112"/><path stroke-dasharray="10 8" d="M598 182l35-13"/></g><g class="motion-layer"><rect class="ambient-glow" x="13" y="13" width="694" height="394" rx="18"/><path class="gold gold-trace" d="M35 386H685"/></g></svg>