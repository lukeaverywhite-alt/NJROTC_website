<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="fitness-assessments-title fitness-assessments-desc" data-motion-state="final"><title id="fitness-assessments-title">Seasonal fitness assessment stations</title><desc id="fitness-assessments-desc">A right-angle push-up anchors smaller curl-up, plank, and running station scenes.</desc><style>.bg{fill:#071525}.grid{fill:none;stroke:#244968;stroke-width:1;opacity:.42}.ice{fill:none;stroke:#dcecf5;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}.ice-fill{fill:#dcecf5}.depth{fill:none;stroke:#6b91aa;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.shadow{fill:#02070d;opacity:.55}.gold{fill:none;stroke:#e6bb50;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.motion-layer{pointer-events:none}.gold-trace{stroke-dasharray:1100;stroke-dashoffset:0}.ambient-glow{fill:none;stroke:#e6bb50;stroke-width:2;opacity:.28}svg:target .gold-trace{animation:trace 1.7s ease-out both}svg:target .ambient-glow{animation:glow 1.7s ease-out both}@keyframes trace{from{stroke-dashoffset:1100}to{stroke-dashoffset:0}}@keyframes glow{from{opacity:0}to{opacity:.28}}@media(prefers-reduced-motion: reduce){svg:target .gold-trace,svg:target .ambient-glow{animation:none}}</style><rect class="bg" width="720" height="420"/><path class="grid" d="M0 70H720M0 140H720M0 210H720M0 280H720M0 350H720M90 0V420M180 0V420M270 0V420M360 0V420M450 0V420M540 0V420M630 0V420"/><path class="gold" d="M38 318H682"/><path class="shadow" d="M70 329h325l-28 14H48zm400-18h180l-24 12H450z"/><g id="push-up-cadet" class="ice"><circle class="ice-fill" stroke="none" cx="120" cy="219" r="18"/><path stroke-width="13" d="M140 233L272 251L342 288"/><path d="M166 237l-17 57m48-53l-9 58m154-11l31 15"/><path class="depth" d="M76 307H390"/></g><g id="curl-up-station" transform="translate(410 52)"><rect class="depth" x="0" y="0" width="125" height="100" rx="10"/><circle class="ice-fill" cx="31" cy="63" r="10"/><path class="ice" d="M42 68q34 4 48-30m-22 16l28 30M45 72L25 86"/></g><g id="plank-station" transform="translate(550 52)"><rect class="depth" width="130" height="100" rx="10"/><circle class="ice-fill" cx="28" cy="55" r="9"/><path class="ice" d="M40 60l58 10m-44-8L38 84m60-14l20 19"/></g><g id="run-station"><path class="depth" d="M444 302q91-93 220-26"/><circle class="ice-fill" cx="525" cy="219" r="12"/><path class="ice" d="M523 234l17 39m-10-23l-28 18m32-19l28-21m-22 45l-24 31m24-31l36 22"/></g><path class="depth" d="M405 35v145" stroke-dasharray="6 8"/><g class="motion-layer"><rect class="ambient-glow" x="13" y="13" width="694" height="394" rx="18"/><path class="gold gold-trace" d="M35 386H685"/></g></svg>