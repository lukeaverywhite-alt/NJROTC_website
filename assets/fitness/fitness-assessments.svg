<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="fitness-assessments-title fitness-assessments-desc" data-motion-state="final">
<title id="fitness-assessments-title">Fall and spring fitness assessments</title><desc id="fitness-assessments-desc">Two seasonal tracks show strength stations converging on a one-mile run.</desc>
<style>:root{--navy:#071525;--blue:#244968;--gold:#e6bb50;--ice:#dcecf5}.bg{fill:var(--navy)}.grid{stroke:var(--blue);stroke-width:1;opacity:.55}.motion-layer{fill:none;stroke:var(--ice);stroke-width:8;stroke-linecap:round;stroke-linejoin:round}.route{stroke:var(--gold);stroke-width:5;stroke-dasharray:900;stroke-dashoffset:900}svg:target .route{animation:draw 1.7s ease-out forwards}svg:target .delay{animation-delay:.25s}@keyframes draw{to{stroke-dashoffset:0}}@media(prefers-reduced-motion: reduce){svg:target .route{animation:none;stroke-dashoffset:0}}</style>
<rect class="bg" width="720" height="420"/><g class="grid"><path d="M0 70H720M0 140H720M0 210H720M0 280H720M0 350H720M90 0V420M180 0V420M270 0V420M360 0V420M450 0V420M540 0V420M630 0V420"/></g><g class="motion-layer"><path class="route" d="M70 130H300Q350 130 380 210Q410 290 650 290"/><path class="route delay" d="M70 290H300Q350 290 380 210Q410 130 650 130"/><circle cx="130" cy="130" r="28"/><circle cx="250" cy="130" r="28"/><rect x="105" y="265" width="55" height="20" rx="10"/><rect x="215" y="265" width="70" height="20" rx="10"/><path d="M525 190l35 20-35 20z"/></g></svg>