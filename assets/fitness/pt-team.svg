<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="pt-team-title pt-team-desc" data-motion-state="final">
<title id="pt-team-title">PT Team relay</title><desc id="pt-team-desc">Three anonymous cadets move in parallel lanes toward a shared drill-meet finish.</desc>
<style>:root{--navy:#071525;--blue:#244968;--gold:#e6bb50;--ice:#dcecf5}.bg{fill:var(--navy)}.grid{stroke:var(--blue);stroke-width:1;opacity:.55}.motion-layer{fill:none;stroke:var(--ice);stroke-width:8;stroke-linecap:round;stroke-linejoin:round}.route{stroke:var(--gold);stroke-width:5;stroke-dasharray:900;stroke-dashoffset:900}svg:target .route{animation:draw 1.7s ease-out forwards}svg:target .delay{animation-delay:.25s}@keyframes draw{to{stroke-dashoffset:0}}@media(prefers-reduced-motion: reduce){svg:target .route{animation:none;stroke-dashoffset:0}}</style>
<rect class="bg" width="720" height="420"/><g class="grid"><path d="M0 70H720M0 140H720M0 210H720M0 280H720M0 350H720M90 0V420M180 0V420M270 0V420M360 0V420M450 0V420M540 0V420M630 0V420"/></g><g class="motion-layer"><path class="route" d="M65 325H660"/><g transform="translate(155 150)"><circle cx="0" cy="0" r="22"/><path d="M0 22l30 75M5 48l-45 30M25 90l-35 65M30 96l55 35"/></g><g transform="translate(345 135)"><circle cx="0" cy="0" r="22"/><path d="M0 22l20 80M5 55l55 5M18 98l-50 55M20 100l52 48"/></g><g transform="translate(525 155)"><circle cx="0" cy="0" r="22"/><path d="M0 22l-20 78M-5 55l-55 15M-18 98l-55 42M-20 98l38 65"/></g></g></svg>