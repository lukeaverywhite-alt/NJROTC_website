<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="pt-team-title pt-team-desc" data-motion-state="final"><title id="pt-team-title">PT Team relay</title><desc id="pt-team-desc">Three anonymous runners move through parallel lanes toward a drill-meet finish marker.</desc><style>.bg{fill:#071525}.grid{fill:none;stroke:#244968;stroke-width:1;opacity:.42}.ice{fill:none;stroke:#dcecf5;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}.ice-fill{fill:#dcecf5}.depth{fill:none;stroke:#6b91aa;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.shadow{fill:#02070d;opacity:.55}.gold{fill:none;stroke:#e6bb50;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.motion-layer{pointer-events:none}.gold-trace{stroke-dasharray:1100;stroke-dashoffset:0}.ambient-glow{fill:none;stroke:#e6bb50;stroke-width:2;opacity:.28}svg:target .gold-trace{animation:trace 1.7s ease-out both}svg:target .ambient-glow{animation:glow 1.7s ease-out both}@keyframes trace{from{stroke-dashoffset:1100}to{stroke-dashoffset:0}}@keyframes glow{from{opacity:0}to{opacity:.28}}@media(prefers-reduced-motion: reduce){svg:target .gold-trace,svg:target .ambient-glow{animation:none}}</style><rect class="bg" width="720" height="420"/><path class="grid" d="M0 70H720M0 140H720M0 210H720M0 280H720M0 350H720M90 0V420M180 0V420M270 0V420M360 0V420M450 0V420M540 0V420M630 0V420"/><g id="relay-lanes" class="depth"><path d="M35 330L682 275M38 371L686 315M55 289L677 237"/><path class="gold" d="M50 350L685 295"/></g><path class="shadow" d="M125 326h120l-22 12H105zm205-70h115l-20 11H313zm180-69h105l-18 10H493z"/><g id="runner" class="ice"><circle class="ice-fill" stroke="none" cx="185" cy="210" r="17"/><path d="M181 231l22 60m-13-34l-48 20m52-22l43-35m-34 71l-50 34m50-34l52 27"/></g><g id="runner-middle" class="ice"><circle class="ice-fill" stroke="none" cx="379" cy="161" r="16"/><path d="M377 180l-5 59m2-32l-43-25m42 23l50 5m-51 29l-39 43m39-43l48 38"/></g><g id="runner-front" class="ice"><circle class="ice-fill" stroke="none" cx="548" cy="110" r="15"/><path d="M544 128l29 52m-18-29l-39 27m42-29l37-32m-22 63l-27 49m27-49l54 15"/></g><g id="finish-marker"><path class="gold" d="M640 80v225m45-236v232M640 84l45-11"/><path fill="#e6bb50" d="M640 84h45v31h-45z"/><path fill="#071525" d="M640 84h15v15h-15zm30 0h15v15h-15zm-15 15h15v16h-15z"/></g><g class="motion-layer"><rect class="ambient-glow" x="13" y="13" width="694" height="394" rx="18"/><path class="gold gold-trace" d="M35 386H685"/></g></svg>