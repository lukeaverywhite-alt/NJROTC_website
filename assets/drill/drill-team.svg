<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="drill_team_title drill_team_desc"><title id="drill_team_title">Drill Team coordination</title><desc id="drill_team_desc">A squad formation advances together along parallel guide lines to represent synchronized competition drill.</desc><style>
:root{--bg:#071422;--panel:#0d2236;--line:#e6bb50;--ink:#eef3f8;--muted:#8fa8bd;--accent:#9d2945}@media(prefers-color-scheme:light){:root{--bg:#eef2f5;--panel:#fff;--line:#806018;--ink:#152536;--muted:#536475;--accent:#84243d}}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--muted);stroke-width:2}.line{fill:none;stroke:var(--line);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.cadet{fill:var(--accent);stroke:var(--ink);stroke-width:3}.guard{fill:var(--line);stroke:var(--ink);stroke-width:3}.label{fill:var(--ink);font:700 18px system-ui,sans-serif;letter-spacing:2px}.muted{fill:var(--muted);font:14px system-ui,sans-serif}.path{fill:none;stroke:var(--line);stroke-width:4;stroke-dasharray:10 12;stroke-linecap:round}.arrow{fill:var(--line)}
@keyframes team-step{0%,100%{transform:translateX(-12px)}50%{transform:translateX(12px)}}.rank{animation:team-step 5.5s ease-in-out infinite}.rank:nth-of-type(2){animation-delay:-1.2s}
@media(prefers-reduced-motion: reduce){*{animation:none!important}}
</style><rect class="bg" width="720" height="420" rx="24"/><rect class="panel" x="24" y="24" width="672" height="372" rx="18"/><text class="label" x="54" y="65">COORDINATED TEAM MOVEMENT</text><path class="path" d="M105 135h500M105 225h500M105 315h500"/><g class="rank"><circle class="cadet" cx="190" cy="135" r="18"/><circle class="cadet" cx="310" cy="135" r="18"/><circle class="cadet" cx="430" cy="135" r="18"/><circle class="cadet" cx="550" cy="135" r="18"/></g><g class="rank"><circle class="cadet" cx="190" cy="225" r="18"/><circle class="cadet" cx="310" cy="225" r="18"/><circle class="cadet" cx="430" cy="225" r="18"/><circle class="cadet" cx="550" cy="225" r="18"/></g><path class="line" d="M130 350h450"/><path class="arrow" d="m580 350-22-13v26z"/></svg>
