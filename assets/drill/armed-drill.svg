<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="armed_drill_title armed_drill_desc"><title id="armed_drill_title">Armed Drill manual-of-arms concept</title><desc id="armed_drill_desc">A simplified drill rifle silhouette shifts between two controlled positions beside a stationary cadet marker.</desc><style>
:root{--bg:#071422;--panel:#0d2236;--line:#e6bb50;--ink:#eef3f8;--muted:#8fa8bd;--accent:#9d2945}@media(prefers-color-scheme:light){:root{--bg:#eef2f5;--panel:#fff;--line:#806018;--ink:#152536;--muted:#536475;--accent:#84243d}}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--muted);stroke-width:2}.line{fill:none;stroke:var(--line);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.cadet{fill:var(--accent);stroke:var(--ink);stroke-width:3}.guard{fill:var(--line);stroke:var(--ink);stroke-width:3}.label{fill:var(--ink);font:700 18px system-ui,sans-serif;letter-spacing:2px}.muted{fill:var(--muted);font:14px system-ui,sans-serif}.path{fill:none;stroke:var(--line);stroke-width:4;stroke-dasharray:10 12;stroke-linecap:round}.arrow{fill:var(--line)}
@keyframes arms-position{0%,30%{transform:rotate(-8deg) translateX(-20px)}55%,80%{transform:rotate(8deg) translateX(20px)}100%{transform:rotate(-8deg) translateX(-20px)}}.rifle{animation:arms-position 7.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@media(prefers-reduced-motion: reduce){*{animation:none!important}}
</style><rect class="bg" width="720" height="420" rx="24"/><rect class="panel" x="24" y="24" width="672" height="372" rx="18"/><text class="label" x="54" y="65">CONTROLLED MANUAL-OF-ARMS MOVEMENTS</text><circle class="cadet" cx="355" cy="185" r="28"/><path class="line" d="M355 215v105M300 270h110M320 365l35-45 35 45"/><g class="rifle"><path d="M475 120h16v205h-16z" fill="var(--line)" stroke="var(--ink)" stroke-width="3"/><path d="m460 300 32-35 20 20-20 40z" fill="var(--accent)" stroke="var(--ink)" stroke-width="3"/></g><path class="path" d="M210 165q-55 55 0 110"/><text class="muted" x="75" y="310">PRECISION + SAFE CONTROL</text></svg>
