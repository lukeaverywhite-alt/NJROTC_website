<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="unarmed_drill_title unarmed_drill_desc"><title id="unarmed_drill_title">Unarmed Drill facing movement</title><desc id="unarmed_drill_desc">Cadet markers rotate together from one direction to another while maintaining alignment.</desc><style>
:root{--bg:#071422;--panel:#0d2236;--line:#e6bb50;--ink:#eef3f8;--muted:#8fa8bd;--accent:#9d2945}@media(prefers-color-scheme:light){:root{--bg:#eef2f5;--panel:#fff;--line:#806018;--ink:#152536;--muted:#536475;--accent:#84243d}}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--muted);stroke-width:2}.line{fill:none;stroke:var(--line);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.cadet{fill:var(--accent);stroke:var(--ink);stroke-width:3}.guard{fill:var(--line);stroke:var(--ink);stroke-width:3}.label{fill:var(--ink);font:700 18px system-ui,sans-serif;letter-spacing:2px}.muted{fill:var(--muted);font:14px system-ui,sans-serif}.path{fill:none;stroke:var(--line);stroke-width:4;stroke-dasharray:10 12;stroke-linecap:round}.arrow{fill:var(--line)}
@keyframes facing-turn{0%,25%{transform:rotate(0)}50%,75%{transform:rotate(90deg)}100%{transform:rotate(0)}}.facing{animation:facing-turn 7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@media(prefers-reduced-motion: reduce){*{animation:none!important}}
</style><rect class="bg" width="720" height="420" rx="24"/><rect class="panel" x="24" y="24" width="672" height="372" rx="18"/><text class="label" x="54" y="65">ALIGNMENT • CADENCE • FACING</text><path class="line" d="M125 135h470M125 300h470" opacity=".35"/><g class="facing"><path class="cadet" d="M175 185l25 25-25 25-25-25z"/><path class="cadet" d="M295 185l25 25-25 25-25-25z"/><path class="cadet" d="M415 185l25 25-25 25-25-25z"/><path class="cadet" d="M535 185l25 25-25 25-25-25z"/></g><path class="path" d="M210 335q150 55 300 0"/><text class="muted" x="270" y="375">MOVE TOGETHER ON COMMAND</text></svg>
