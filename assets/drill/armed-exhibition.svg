<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="armed_exhibition_title armed_exhibition_desc"><title id="armed_exhibition_title">Armed Exhibition exchange concept</title><desc id="armed_exhibition_desc">Two cadet markers coordinate a permitted rifle exchange across a clearly marked safety space.</desc><style>
:root{--bg:#071422;--panel:#0d2236;--line:#e6bb50;--ink:#eef3f8;--muted:#8fa8bd;--accent:#9d2945}@media(prefers-color-scheme:light){:root{--bg:#eef2f5;--panel:#fff;--line:#806018;--ink:#152536;--muted:#536475;--accent:#84243d}}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--muted);stroke-width:2}.line{fill:none;stroke:var(--line);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.cadet{fill:var(--accent);stroke:var(--ink);stroke-width:3}.guard{fill:var(--line);stroke:var(--ink);stroke-width:3}.label{fill:var(--ink);font:700 18px system-ui,sans-serif;letter-spacing:2px}.muted{fill:var(--muted);font:14px system-ui,sans-serif}.path{fill:none;stroke:var(--line);stroke-width:4;stroke-dasharray:10 12;stroke-linecap:round}.arrow{fill:var(--line)}
@keyframes exchange-pass{0%,18%{transform:translateX(-95px) rotate(-8deg)}48%,68%{transform:translateX(95px) rotate(8deg)}100%{transform:translateX(-95px) rotate(-8deg)}}.exchange{animation:exchange-pass 8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@media(prefers-reduced-motion: reduce){*{animation:none!important}}
</style><rect class="bg" width="720" height="420" rx="24"/><rect class="panel" x="24" y="24" width="672" height="372" rx="18"/><text class="label" x="54" y="65">PRECISION • CREATIVITY • SAFETY</text><circle class="cadet" cx="180" cy="255" r="28"/><circle class="cadet" cx="540" cy="255" r="28"/><path class="line" d="M180 285v65M540 285v65"/><path class="path" d="M240 175h240"/><g class="exchange"><path d="M345 115h15v150h-15z" fill="var(--line)" stroke="var(--ink)" stroke-width="3"/><path d="m330 240 30-35 20 20-20 35z" fill="var(--accent)" stroke="var(--ink)" stroke-width="3"/></g><path class="line" d="M270 310h165" opacity=".35"/><text class="muted" x="240" y="365">ONLY WHERE EVENT RULES PERMIT</text></svg>
