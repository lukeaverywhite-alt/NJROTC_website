<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="unarmed_exhibition_title unarmed_exhibition_desc"><title id="unarmed_exhibition_title">Unarmed Exhibition pathway</title><desc id="unarmed_exhibition_desc">Cadet markers follow an original curved pathway and resolve into a synchronized shape.</desc><style>
:root{--bg:#071422;--panel:#0d2236;--line:#e6bb50;--ink:#eef3f8;--muted:#8fa8bd;--accent:#9d2945}@media(prefers-color-scheme:light){:root{--bg:#eef2f5;--panel:#fff;--line:#806018;--ink:#152536;--muted:#536475;--accent:#84243d}}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--muted);stroke-width:2}.line{fill:none;stroke:var(--line);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.cadet{fill:var(--accent);stroke:var(--ink);stroke-width:3}.guard{fill:var(--line);stroke:var(--ink);stroke-width:3}.label{fill:var(--ink);font:700 18px system-ui,sans-serif;letter-spacing:2px}.muted{fill:var(--muted);font:14px system-ui,sans-serif}.path{fill:none;stroke:var(--line);stroke-width:4;stroke-dasharray:10 12;stroke-linecap:round}.arrow{fill:var(--line)}
@keyframes exhibit-flow{0%{stroke-dashoffset:90}50%,100%{stroke-dashoffset:0}}.flow{animation:exhibit-flow 5s ease-in-out infinite}@keyframes exhibit-pulse{50%{transform:scale(1.12)}}.creative{animation:exhibit-pulse 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@media(prefers-reduced-motion: reduce){*{animation:none!important}}
</style><rect class="bg" width="720" height="420" rx="24"/><rect class="panel" x="24" y="24" width="672" height="372" rx="18"/><text class="label" x="54" y="65">ORIGINAL ROUTINE • NO RIFLES</text><path class="path flow" d="M105 290C190 100 300 350 390 165s175-40 225 75"/><g class="creative"><circle class="cadet" cx="185" cy="225" r="20"/><circle class="cadet" cx="305" cy="265" r="20"/><circle class="cadet" cx="410" cy="150" r="20"/><circle class="cadet" cx="540" cy="195" r="20"/></g><path class="line" d="m595 215 25 25-25 25"/><text class="muted" x="230" y="360">CREATIVITY • DIFFICULTY • SYNCHRONIZATION</text></svg>
