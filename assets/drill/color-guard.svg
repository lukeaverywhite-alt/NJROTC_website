<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="color_guard_title color_guard_desc"><title id="color_guard_title">Color Guard formation</title><desc id="color_guard_desc">Four markers show two central color bearers protected by outside rifle guards while the colors gently wave.</desc><style>
:root{--bg:#071422;--panel:#0d2236;--line:#e6bb50;--ink:#eef3f8;--muted:#8fa8bd;--accent:#9d2945}@media(prefers-color-scheme:light){:root{--bg:#eef2f5;--panel:#fff;--line:#806018;--ink:#152536;--muted:#536475;--accent:#84243d}}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--muted);stroke-width:2}.line{fill:none;stroke:var(--line);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.cadet{fill:var(--accent);stroke:var(--ink);stroke-width:3}.guard{fill:var(--line);stroke:var(--ink);stroke-width:3}.label{fill:var(--ink);font:700 18px system-ui,sans-serif;letter-spacing:2px}.muted{fill:var(--muted);font:14px system-ui,sans-serif}.path{fill:none;stroke:var(--line);stroke-width:4;stroke-dasharray:10 12;stroke-linecap:round}.arrow{fill:var(--line)}
@keyframes colors-wave{0%,100%{transform:skewY(0deg)}50%{transform:skewY(3deg)}}.flag{animation:colors-wave 4.8s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}
@media(prefers-reduced-motion: reduce){*{animation:none!important}}
</style><rect class="bg" width="720" height="420" rx="24"/><rect class="panel" x="24" y="24" width="672" height="372" rx="18"/><text class="label" x="54" y="65">STANDARD FOUR-CADET FORMATION</text><line class="line" x1="250" y1="125" x2="250" y2="290"/><line class="line" x1="430" y1="125" x2="430" y2="290"/><g class="flag"><path fill="#b22234" stroke="var(--ink)" stroke-width="2" d="M250 128h95v64h-95z"/><path fill="#234e8a" stroke="var(--ink)" stroke-width="2" d="M430 128h95v64h-95z"/></g><circle class="guard" cx="130" cy="300" r="24"/><circle class="cadet" cx="250" cy="300" r="24"/><circle class="cadet" cx="430" cy="300" r="24"/><circle class="guard" cx="590" cy="300" r="24"/><text class="muted" x="85" y="350">RIFLE GUARD</text><text class="muted" x="282" y="350">COLORS</text><text class="muted" x="535" y="350">RIFLE GUARD</text></svg>
