<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="drill_overview_title drill_overview_desc"><title id="drill_overview_title">Drill and Ceremony visual overview</title><desc id="drill_overview_desc">Six cadet markers move into an aligned formation to demonstrate coordinated drill.</desc><style>
:root{--bg:#071422;--panel:#0d2236;--line:#e6bb50;--ink:#eef3f8;--muted:#8fa8bd;--accent:#9d2945}@media(prefers-color-scheme:light){:root{--bg:#eef2f5;--panel:#fff;--line:#806018;--ink:#152536;--muted:#536475;--accent:#84243d}}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--muted);stroke-width:2}.line{fill:none;stroke:var(--line);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.cadet{fill:var(--accent);stroke:var(--ink);stroke-width:3}.guard{fill:var(--line);stroke:var(--ink);stroke-width:3}.label{fill:var(--ink);font:700 18px system-ui,sans-serif;letter-spacing:2px}.muted{fill:var(--muted);font:14px system-ui,sans-serif}.path{fill:none;stroke:var(--line);stroke-width:4;stroke-dasharray:10 12;stroke-linecap:round}.arrow{fill:var(--line)}
@keyframes overview-align{0%,15%{transform:translate(var(--sx),var(--sy))}45%,85%{transform:translate(0,0)}100%{transform:translate(var(--sx),var(--sy))}}.m{animation:overview-align 8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@media(prefers-reduced-motion: reduce){*{animation:none!important}}
</style><rect class="bg" width="720" height="420" rx="24"/><rect class="panel" x="24" y="24" width="672" height="372" rx="18"/><text class="label" x="54" y="65">FORM • ALIGN • MOVE</text><path class="path" d="M95 325 Q205 210 330 310 T625 150"/><g class="m" style="--sx:-35px;--sy:45px"><circle class="cadet" cx="255" cy="165" r="19"/></g><g class="m" style="--sx:60px;--sy:-15px"><circle class="cadet" cx="360" cy="165" r="19"/></g><g class="m" style="--sx:-50px;--sy:-40px"><circle class="cadet" cx="465" cy="165" r="19"/></g><g class="m" style="--sx:35px;--sy:45px"><circle class="cadet" cx="255" cy="270" r="19"/></g><g class="m" style="--sx:-55px;--sy:10px"><circle class="cadet" cx="360" cy="270" r="19"/></g><g class="m" style="--sx:40px;--sy:-40px"><circle class="cadet" cx="465" cy="270" r="19"/></g><path class="line" d="M220 120h280M220 315h280" opacity=".35"/></svg>
