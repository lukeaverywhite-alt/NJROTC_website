<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="unit-title unit-desc">
  <title id="unit-title">Bethel High School NJROTC wildcat and anchor emblem</title>
  <desc id="unit-desc">A symmetrical gold wildcat above a naval anchor within a crisp navy command-style shield.</desc>
  <defs>
    <linearGradient id="navy" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#102d50"/><stop offset="1" stop-color="#04101f"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff0a8"/><stop offset=".42" stop-color="#e8be55"/><stop offset="1" stop-color="#a97216"/></linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <!-- The shield and inner rings remain separate from the subject, keeping every edge legible at small sizes. -->
  <path d="M256 14 464 88v151c0 126-80 214-208 259C128 453 48 365 48 239V88z" fill="#020a14" stroke="url(#gold)" stroke-width="10"/>
  <path d="M256 35 443 101v138c0 112-69 191-187 235C138 430 69 351 69 239V101z" fill="url(#navy)" stroke="#6f5724" stroke-width="2"/>
  <path d="M91 119 256 61l165 58M91 389h330" fill="none" stroke="#e8be55" stroke-opacity=".35" stroke-width="2"/>
  <g fill="#e8be55" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="middle" letter-spacing="7">
    <text x="256" y="112" font-size="30">BETHEL</text><text x="256" y="446" font-size="25">NJROTC</text>
  </g>
  <!-- Naval anchor: a clean silhouette behind, but not intersecting, the wildcat face. -->
  <g fill="none" stroke="url(#gold)" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <circle cx="256" cy="156" r="18" stroke-width="10"/><path d="M256 174v172M215 202h82" stroke-width="11"/>
    <path d="M160 311c17 64 52 91 96 91s79-27 96-91M160 311l-17 29 31-8m178-21 17 29-31-8" stroke-width="13"/>
  </g>
  <!-- Original, geometric wildcat: balanced ears, muzzle, eyes and cheek planes. -->
  <g stroke="#e8be55" stroke-linejoin="round">
    <path d="m158 170 53 23 45-17 45 17 53-23-15 67c9 30 3 67-18 92l-65 47-65-47c-21-25-27-62-18-92z" fill="#071728" stroke-width="7"/>
    <path d="m174 184 39 23-30 27zm164 0-39 23 30 27z" fill="#e8be55" stroke-width="4"/>
    <path d="m190 230 50 12-23 29-37-18zm132 0-50 12 23 29 37-18z" fill="#d8dee7" stroke-width="4"/>
    <path d="m196 247 31 6-13 10zm120 0-31 6 13 10z" fill="#e8be55" stroke="none"/>
    <path d="m256 244-24 58 24 20 24-20z" fill="#102d50" stroke-width="5"/>
    <path d="m225 300 31 15 31-15-9 35-22 20-22-20z" fill="#e8be55" stroke-width="5"/>
    <path d="m240 316 16 7 16-7-5 14h-22z" fill="#030a13" stroke="none"/>
    <path d="M180 280h47m-55 18h57m103-18h-47m55 18h-57" fill="none" stroke-width="4" stroke-linecap="round"/>
  </g>
  <circle cx="256" cy="256" r="224" fill="none" stroke="#f5d77e" stroke-opacity=".18" stroke-width="2" stroke-dasharray="3 13"/>
</svg>
