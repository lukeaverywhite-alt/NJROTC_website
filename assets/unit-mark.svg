<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="unit-title unit-desc">
  <title id="unit-title">Bethel NJROTC unit mark</title>
  <desc id="unit-desc">Navy and gold circular Bethel NJROTC emblem with a gold anchor and maroon and white wildcat.</desc>
  <defs>
    <linearGradient id="unit-gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f2d780"/><stop offset="1" stop-color="#ad7b22"/></linearGradient>
    <path id="unit-top-arc" d="M92 250a164 164 0 0 1 328 0"/>
    <path id="unit-bottom-arc" d="M82 287a180 180 0 0 0 348 0"/>
    <mask id="unit-field-mask"><circle cx="256" cy="256" r="214" fill="white"/></mask>
    <filter id="unit-shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity=".35"/></filter>
  </defs>
  <circle cx="256" cy="256" r="246" fill="#07172d" stroke="url(#unit-gold)" stroke-width="12"/>
  <circle cx="256" cy="256" r="216" fill="#102845" stroke="#d4ad4d" stroke-width="3" mask="url(#unit-field-mask)"/>
  <g fill="#f8f4e8" font-family="system-ui, sans-serif" font-weight="800" text-anchor="middle">
    <text font-size="54" letter-spacing="9"><textPath href="#unit-top-arc" startOffset="50%">BETHEL</textPath></text>
    <text font-size="46" letter-spacing="8"><textPath href="#unit-bottom-arc" startOffset="50%">NJROTC</textPath></text>
  </g>
  <g fill="none" stroke="url(#unit-gold)" stroke-linecap="round" stroke-linejoin="round" filter="url(#unit-shadow)">
    <circle cx="256" cy="192" r="22" stroke-width="12"/><path d="M256 214v168M212 242h88M170 326c18 54 54 74 86 74s68-20 86-74M170 326l-18 25m18-25 27 8m145-8 18 25m-18-25-27 8" stroke-width="14"/>
  </g>
  <g stroke="#24131a" stroke-linejoin="round" filter="url(#unit-shadow)">
    <path d="M151 251l45-44 3 34c30-30 76-42 116-24l37-17-14 41c20 18 29 38 31 61-25-14-43-14-60-7-17 8-28 20-44 22-25 3-45-20-64-27l-40 14 17-31z" fill="#7c1e3e" stroke-width="8"/>
    <path d="M201 242c26-20 62-25 95-12-28 2-49 11-64 28l-47 4zm70 25c21-8 45-3 62 10l-28 7-14 20-24-14z" fill="#fff" stroke-width="6"/>
    <path d="m324 273 31 4-19 17z" fill="#24131a" stroke-width="4"/><circle cx="289" cy="269" r="4" fill="#d5ad52" stroke="none"/>
  </g>
</svg>
