name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Stage static site
        run: |
          rm -rf _site
          mkdir _site
          cp index.html 404.html styles.css script.js weather.js _site/
          cp -R pages assets data _site/
          cp "CFM 12th Edition Master Draft (0509-LP-002-6028) 17 APR 2024.pdf" _site/
          cp "2024 CRM 4th Edition (0509-LP-002-6029) 18 APR 2024.pdf" crm-3rd_edition.pdf _site/
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
